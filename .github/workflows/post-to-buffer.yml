name: Post Sudoku Reel to Buffer Queue

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  top_up_queue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: python -m pip install -r requirements.txt

      - name: Render Sudoku Reel
        env:
          DIFFICULTY: easy
        run: ./scripts/render.sh

      - name: Post to Buffer Queue
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          MAX_BUFFER_QUEUE: 5
        run: python scripts/post_to_buffer.py

      - name: Advance Progress Pointer (if posted)
        run: |
          if [ ! -f outputs/queue_full ]; then
            python scripts/advance_progress.py
          fi

      - name: Commit and Push Progress State
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/progress.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: advance sudoku progress" && git push)
